{% extends "base.html" %}

{% block contenido %}

    <h2>{{ titulo }}</h2>

    <form>

        <div>
            <label for="usuario">Nombre de usuario:</label>
            <input
                type="text"
                id="usuario"
                name="usuario"
            >
        </div>

        <div>
            <label for="correo">Correo electrónico:</label>
            <input
                type="email"
                id="correo"
                name="correo"
            >
        </div>

        <div>
            <label for="password">Contraseña:</label>
            <input
                type="password"
                id="password"
                name="password"
            >
        </div>

        <p>La contraseña debe contener:</p>

        <ul>
            <li>Mínimo 8 caracteres.</li>
            <li>Al menos una letra mayúscula.</li>
            <li>Al menos un número.</li>
        </ul>

        <div>
            <label for="confirmar_password">
                Confirmar contraseña:
            </label>

            <input
                type="password"
                id="confirmar_password"
                name="confirmar_password"
            >
        </div>

        <div>
            <input
                type="checkbox"
                id="mostrar_password"
                onclick="mostrarPasswordRegistro()"
            >

            <label for="mostrar_password">
                Mostrar contraseñas
            </label>
        </div>

        <button
            type="button"
            id="btnRegistrar"
            onclick="leerDatosRegistro()"
        >
            Registrarse
        </button>

        <p class="enlace-navegacion">
            ¿Ya tienes una cuenta?
            <a href="/login/">Iniciar sesión</a>
        </p>

    </form>

{% endblock %}
