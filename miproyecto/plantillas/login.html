{% extends "base.html" %}


{% block contenido %}

    <h2>Inicio de sesión</h2>

    <div>

        <label for="login_usuario">
            Nombre de usuario:
        </label>

        <input
            type="text"
            id="login_usuario"
            name="login_usuario"
        >

    </div>


    <div>

        <label for="login_password">
            Contraseña:
        </label>

        <input
            type="password"
            id="login_password"
            name="login_password" 
        >

    </div>


    <button
        type="button"
        onclick="leerDatosLogin()"
    >
        Ingresar
    </button>

{% endblock %}
